name: update stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install fonttools brotli

      - name: generate heading svgs
        run: python scripts/generate_headings.py

      - name: generate stat svgs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hd-*.svg streak.svg langs.svg year.svg
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "chore: refresh generated stats"
          git push
