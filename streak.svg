<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 90" width="620" height="90">
  <style>@font-face{font-family:'JBM-ST';src:url(data:font/woff;base64,) format('woff');font-weight:700;}
    .st-num { font-family:'JBM-ST',monospace; font-size:40px; font-weight:700; fill:#a259ff; }
    .st-lbl { font-family:'JBM-ST',monospace; font-size:13px; letter-spacing:2px; fill:#6e6e80; text-transform:uppercase; }
  </style>
  <text x="0" y="50" class="st-num">3 days</text>
